[package]
name = "marketd"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[features]
# Enable with: cargo test --features integration-test
integration-test = ["openswap/integration-test"]

[dependencies]
openswap = { git = "https://github.com/citadel-foss/openswap", branch = "master" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_cbor = "0.11"
hex = "0.4"
bitcoind = "0.36"
secp256k1 = { version = "0.33.0", features = ["rand", "global-context"] }

[dev-dependencies]
ureq = { version = "2", default-features = false, features = ["json"] }
tempfile = "3"
