services:
  tor:
    image: osminogin/tor-simple
    network_mode: host
    entrypoint: /bin/sh
    command:
      - -c
      - |
        HASH=$$(tor --hash-password "$${TOR_AUTH_PASSWORD}" | grep "^16:")
        cat > /tmp/torrc << EOF
        SocksPort 127.0.0.1:$${TOR_SOCKS_PORT:-9050}
        ControlPort 127.0.0.1:$${TOR_CONTROL_PORT:-9051}
        DataDirectory /var/lib/tor
        HashedControlPassword $$HASH
        Log notice stdout
        EOF
        exec tor -f /tmp/torrc
    volumes:
      - tor-data:/var/lib/tor
    environment:
      - TOR_AUTH_PASSWORD=${TOR_AUTH_PASSWORD:-coinswapvps1111}
      - TOR_SOCKS_PORT=${TOR_SOCKS_PORT:-9050}
      - TOR_CONTROL_PORT=${TOR_CONTROL_PORT:-9051}
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "${TOR_SOCKS_PORT:-9050}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  marketd:
    build: .
    network_mode: host
    environment:
      - MARKETD_LISTEN_ADDR=0.0.0.0:${MARKETD_PORT:-3005}
      - MARKETD_HEALTHCHECK_PORT=${MARKETD_PORT:-3005}
      # Existing Signet API: /api/makers, backed by the VPS Bitcoin Core.
      - MARKETD_DATA_DIR=/var/lib/marketd/signet
      - MARKETD_WALLET_NAME=${MARKETD_WALLET_NAME:-marketd-signet}
      - MARKETD_BITCOIN_RPC_URL=${MARKETD_BITCOIN_RPC_URL:-127.0.0.1:${BITCOIN_RPC_PORT:-38332}}
      - MARKETD_BITCOIN_RPC_USER=${BITCOIN_RPC_USER:-signet}
      - MARKETD_BITCOIN_RPC_PASS=${BITCOIN_RPC_PASS:-signetpass}
      - MARKETD_ZMQ_ADDR=${MARKETD_ZMQ_ADDR:-tcp://127.0.0.1:${BITCOIN_ZMQ_PORT:-28332}}
      # Mainnet API: /api/mainnet/makers, backed by Electrum over Tor.
      - MARKETD_MAINNET_DATA_DIR=/var/lib/marketd/mainnet
      - MARKETD_MAINNET_WALLET_NAME=${MARKETD_MAINNET_WALLET_NAME:-marketd-mainnet}
      - MARKETD_ELECTRUM_URL=${MARKETD_ELECTRUM_URL:-ssl://electrum.blockstream.info:50002}
      - MARKETD_ELECTRUM_TOR=${MARKETD_ELECTRUM_TOR:-true}
      - MARKETD_TOR_CONTROL_PORT=${TOR_CONTROL_PORT:-9051}
      - MARKETD_TOR_SOCKS_PORT=${TOR_SOCKS_PORT:-9050}
      - MARKETD_TOR_AUTH_PASSWORD=${TOR_AUTH_PASSWORD:-coinswapvps1111}
      - MARKETD_WALLET_PASSWORD=${MARKETD_WALLET_PASSWORD:-openswap}
      - MARKETD_LOG_FILTER=${RUST_LOG:-info}
    volumes:
      - marketd-data:/var/lib/marketd
    depends_on:
      tor:
        condition: service_healthy
    restart: unless-stopped

volumes:
  tor-data:
    driver: local
  marketd-data:
    driver: local
